<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kimi Translator & Grammar Correction</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="top-bar">
    <div class="lang-bar">
      <button id="btn-zh">中文</button>
      <button id="btn-en">EN</button>
    </div>
    <button class="theme-btn" id="btn-theme" title="Toggle dark mode">&#9788;</button>
  </div>

  <div class="mode-bar">
    <div id="tab-translate" class="mode-tab active">Translate</div>
    <div id="tab-grammar" class="mode-tab">Grammar Check</div>
  </div>

  <div id="sec-translate" class="section active">
    <div class="tone-wrap">
      <div class="sublabel">Tone</div>
      <div class="tone-slider">
        <div class="tone-track"></div>
        <div class="tone-dots">
          <div class="tone-item" data-tone="casual2">
            <div class="tone-dot"></div>
            <div class="tone-label">Casual II</div>
          </div>
          <div class="tone-item label-below" data-tone="casual1">
            <div class="tone-dot"></div>
            <div class="tone-label">Casual I</div>
          </div>
          <div class="tone-item active" data-tone="natural">
            <div class="tone-dot"></div>
            <div class="tone-label">Natural</div>
          </div>
          <div class="tone-item label-below" data-tone="formal1">
            <div class="tone-dot"></div>
            <div class="tone-label">Formal I</div>
          </div>
          <div class="tone-item" data-tone="formal2">
            <div class="tone-dot"></div>
            <div class="tone-label">Formal II</div>
          </div>
        </div>
      </div>
    </div>

    <div class="label">Instructions (Editable)</div>
    <textarea id="tone-prompt" class="box-small" placeholder=""></textarea>
    <div class="input-actions">
      <a class="x-vibe-btn" id="btn-x-vibe" href="javascript:void(0)"></a>
      <button class="btn-secondary" id="btn-reset">Reset</button>
    </div>

    <div class="label">Enter text to translate</div>
    <textarea id="translate-input" class="box-large" placeholder=""></textarea>
    <div class="input-actions">
      <button class="btn-secondary" id="btn-clear">Clear</button>
    </div>

    <button class="btn" id="btn-translate">Translate</button>
  </div>

  <div id="sec-grammar" class="section">
    <div class="label">Additional Focus (Optional)</div>
    <textarea id="grammar-prompt" class="box-small" placeholder=""></textarea>
    <div class="input-actions">
      <button class="btn-secondary" id="btn-grammar-reset">Reset</button>
    </div>

    <div class="label">Enter text to check</div>
    <textarea id="grammar-input" class="box-large" placeholder=""></textarea>
    <div class="input-actions">
      <button class="btn-secondary" id="btn-grammar-clear">Clear</button>
    </div>

    <button class="btn" id="btn-check">Check</button>
  </div>

  <div id="loading" class="loading">
    <div class="spinner-wrap" id="loading-spinner">
      <img src="thinking.svg" alt="Loading..." id="loading-img">
    </div>
    <div class="loading-text" id="loading-text"></div>
  </div>

  <div id="result-box" class="result-box">
    <div class="result-header">
      <span class="result-title">Result</span>
      <button class="copy-btn" id="btn-copy">Copy</button>
    </div>
    <div id="result-body" class="result-body"></div>
  </div>

  <div class="footer-section">
    <div class="accordion-item">
      <div class="accordion-header" id="usage-header">
        <span class="sublabel" id="footer-usage-label">How to Use</span>
        <span class="accordion-toggle">Expand</span>
      </div>
      <div class="accordion-content" id="footer-usage-text"></div>
    </div>
    <div class="accordion-item">
      <div class="accordion-header" id="troubleshoot-header">
        <span class="sublabel" id="footer-troubleshoot-label">Troubleshoot</span>
        <span class="accordion-toggle">Expand</span>
      </div>
      <div class="accordion-content" id="footer-troubleshoot-text"></div>
    </div>
    <div class="accordion-item">
      <div class="accordion-header" id="credits-header">
        <span class="sublabel" id="footer-credits-label">Credits</span>
        <span class="accordion-toggle">Expand</span>
      </div>
      <div class="accordion-content footer-text" id="footer-credits-text"></div>
    </div>
  </div>

<script src="i18n.js"></script>
<script>
(function() {
  var I18n = window.TranslatorI18n;
  var $ = I18n.$;

  $("btn-zh").addEventListener("click", function() { I18n.setLang("zh"); });
  $("btn-en").addEventListener("click", function() { I18n.setLang("en"); });
  $("tab-translate").addEventListener("click", function() { I18n.setMode("translate"); });
  $("tab-grammar").addEventListener("click", function() { I18n.setMode("grammar"); });
  $("btn-translate").addEventListener("click", I18n.sendTranslate);
  $("btn-check").addEventListener("click", I18n.sendGrammar);
  $("btn-copy").addEventListener("click", I18n.copyResult);
  $("btn-theme").addEventListener("click", I18n.toggleTheme);

  document.querySelectorAll(".tone-item").forEach(function(el) {
    el.addEventListener("click", function() { I18n.setTone(this.getAttribute("data-tone")); });
  });

  $("btn-x-vibe").addEventListener("click", function(e) {
    e.preventDefault();
    I18n.toggleXvibe();
  });

  $("btn-clear").addEventListener("click", function() { $("translate-input").value = ""; });
  $("btn-reset").addEventListener("click", function() {
    I18n.resetXvibe();
    var tone = I18n.currentTone();
    var defaults = I18n.defaultPrompts;
    $("tone-prompt").value = defaults[tone] || "";
  });
  $("btn-grammar-clear").addEventListener("click", function() { $("grammar-input").value = ""; });
  $("btn-grammar-reset").addEventListener("click", function() {
    $("grammar-prompt").value = I18n.defaultGrammarPrompt;
  });

  document.querySelectorAll('.accordion-header').forEach(function(header) {
    header.addEventListener('click', function(e) {
      var content = this.nextElementSibling;
      var toggle = this.querySelector('.accordion-toggle');
      if (!content || !toggle) return;
      var isOpen = content.classList.toggle('show');
      toggle.classList.toggle('open', isOpen);
      var t = I18n.i18n[I18n.currentLang()];
      toggle.textContent = isOpen ? t.collapse : t.expand;
    });
  });

  document.addEventListener('keydown', function(e) {
    if (e.ctrlKey && e.key === 'Enter') {
      if (I18n.currentMode() === 'translate') {
        I18n.sendTranslate();
      } else {
        I18n.sendGrammar();
      }
    }
  });

  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    mq.addEventListener('change', function(e) {
      var saved = localStorage.getItem("theme");
      if (!saved || saved === 'auto') {
        if (e.matches) {
          document.documentElement.setAttribute("data-theme", "dark");
          $("btn-theme").innerHTML = "&#9790;";
        } else {
          document.documentElement.removeAttribute("data-theme");
          $("btn-theme").innerHTML = "&#9788;";
        }
      }
    });
  }

  var slider = document.querySelector(".tone-slider");
  var track = document.querySelector(".tone-track");
  var isDragging = false;

  function updateToneFromX(clientX) {
    var rect = track.getBoundingClientRect();
    var x = clientX - rect.left;
    var width = rect.width;
    var ratio = Math.max(0, Math.min(1, x / width));
    var index = Math.round(ratio * 4);
    var tones = ["casual2", "casual1", "natural", "formal1", "formal2"];
    I18n.setTone(tones[index]);
  }

  slider.addEventListener("pointerdown", function(e) {
    isDragging = true;
    slider.setPointerCapture(e.pointerId);
    slider.style.cursor = "grabbing";
    updateToneFromX(e.clientX);
  });

  slider.addEventListener("pointermove", function(e) {
    if (!isDragging) return;
    e.preventDefault();
    updateToneFromX(e.clientX);
  });

  slider.addEventListener("pointerup", function(e) {
    isDragging = false;
    slider.style.cursor = "";
  });

  slider.addEventListener("pointercancel", function(e) {
    isDragging = false;
    slider.style.cursor = "";
  });
})();
</script>

</body>
</html>
